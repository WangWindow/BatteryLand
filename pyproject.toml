[project]
name = "batteryland"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "ty>=0.0.90,<0.1",
    "types-pyyaml>=6,<7",
]
training = [
    "accelerate>=1.10,<2",
    "denseweight>=0.1.2,<0.2",
    "evaluate>=0.4.6,<0.5",
    "joblib>=1.5,<2",
    "matplotlib>=3.10.6,<4",
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<4",
    "peft>=0.21.2,<0.22",
    "pyyaml>=6,<7",
    "scikit-learn>=1.7.2,<2",
    "scipy>=1.16.1,<2",
    "torch>=2.10,<3",
    "tqdm>=4.67,<5",
    "wandb>=0.21,<1",
]

[tool.uv]
default-groups = ["dev"]
constraint-dependencies = ["kdepy>=1.1.12", "transformers>=5.18,<5.19"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
batteryland = "batteryland.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "training: real provider and standardized battery data acceptance (opt in)",
    "gpu: real cuda:0 acceptance (requires --run-training --run-gpu)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src/batteryland"]

[tool.ty.terminal]
error-on-warning = true
